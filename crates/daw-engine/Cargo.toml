[package]
name = "daw-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Realtime audio engine, devices, plugins and media codecs for Spatial DAW"

[dependencies]
daw-core = { path = "../daw-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
rtrb = { workspace = true }
hound = { workspace = true }
symphonia = { workspace = true }
cpal = { workspace = true }
midir = { workspace = true }
libloading = { workspace = true }
vst3-host = { workspace = true }
vst2-sys = "0.2"
base64 = { workspace = true }

[features]
default = []
# Low-latency ASIO hosting. Requires the Steinberg ASIO SDK, see docs/ASIO.md.
asio = ["cpal/asio"]
