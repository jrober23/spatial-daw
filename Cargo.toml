[workspace]
resolver = "2"
members = ["crates/daw-core", "crates/daw-engine", "crates/spatial-daw"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Spatial DAW contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.13"
crossbeam-channel = "0.5"
rtrb = "0.3"
glam = "0.34"
bytemuck = { version = "1.25", features = ["derive"] }
hound = "3.5"
symphonia = { version = "0.6", features = ["all"] }
cpal = "0.18.2"
midir = "0.11"
libloading = "0.8"
vst3-host = { version = "0.10", default-features = false }
base64 = "0.22"
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "accesskit",
    "x11",
    "wayland",
] }
egui = "0.37"
egui-wgpu = "0.37"
wgpu = "30.0"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Audio DSP is unusable in debug builds if it is fully unoptimised.
[profile.dev.package."*"]
opt-level = 2
